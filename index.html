<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Lota</title>
  <meta name="description" content="Your lota. Finally fits in a jacket.">
  <meta property="og:title" content="Pocket Lota">
  <meta property="og:description" content="Your lota. Finally fits in a jacket.">
  <meta property="og:image" content="lota-stowed.png?v=3">
  <link rel="icon" href="lota-stowed.png?v=3">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      background: #0c0c0c;
      color: #efe8dc;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100dvh;
      max-width: 26rem;
      margin: 0 auto;
      padding: 2rem 1.15rem 7.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }
    h1 {
      font-size: clamp(2.05rem, 8.4vw, 2.7rem);
      line-height: 1.06;
      letter-spacing: -0.03em;
      font-weight: 500;
    }
    .hero {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #111;
      border-radius: 1.05rem;
      overflow: hidden;
    }
    .hero video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 42%;
    }
    .line {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.98rem;
      line-height: 1.45;
      letter-spacing: 0.01em;
      color: #b9b0a3;
    }
    .buy {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.8rem 1.15rem calc(0.8rem + env(safe-area-inset-bottom));
      background: linear-gradient(to top, #0c0c0c 62%, rgba(12,12,12,0));
    }
    .buy a {
      display: block;
      text-align: center;
      text-decoration: none;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #efe8dc;
      color: #111;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.01em;
      border-radius: 999px;
      padding: 0.95rem 1.2rem;
    }
    .buy a:active { transform: scale(0.99); }
  </style>
  <script>
    window.META_PIXEL_ID = "000000000000000";
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
    fbq("init", window.META_PIXEL_ID);
    fbq("track", "PageView");
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=000000000000000&ev=PageView&noscript=1"/></noscript>
</head>
<body>
  <main>
    <h1>Your lota. Finally fits in a jacket.</h1>
    <div class="hero">
      <video
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        poster="lota-stowed.png?v=3"
        src="lota-slide.mp4"
      ></video>
    </div>
    <p class="line">Slides out when you need it. Back in the jacket when you don’t.</p>
  </main>
  <div class="buy">
    <a id="buy" href="https://pocketlota.com">Buy</a>
  </div>
  <script>
    document.getElementById("buy").addEventListener("click", function () {
      if (typeof fbq === "function") {
        fbq("track", "Purchase", { currency: "USD" });
      }
    });
  </script>
</body>
</html>
