<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Lota</title>
  <meta name="description" content="Your lota. Finally fits in a jacket.">
  <meta property="og:title" content="Pocket Lota">
  <meta property="og:description" content="Your lota. Finally fits in a jacket.">
  <meta property="og:image" content="lota-stowed.png?v=2">
  <link rel="icon" href="lota-stowed.png?v=2">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4efe6;
      color: #1c1914;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100dvh;
      max-width: 28rem;
      margin: 0 auto;
      padding: 2.25rem 1.25rem 7.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.35rem;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 2.65rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
      font-weight: 650;
    }
    .hero {
      width: 100%;
      aspect-ratio: 1;
      background: #1a1a1a;
      border-radius: 1.15rem;
      overflow: hidden;
    }
    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .line {
      font-size: 1.05rem;
      line-height: 1.45;
      color: #3f3a33;
    }
    .buy {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.85rem 1.25rem calc(0.85rem + env(safe-area-inset-bottom));
      background: linear-gradient(to top, #f4efe6 70%, rgba(244,239,230,0));
    }
    .buy a {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #1c1914;
      color: #f4efe6;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      border-radius: 999px;
      padding: 0.95rem 1.25rem;
    }
    .buy a:active { transform: scale(0.99); }
  </style>
  <!-- Meta Pixel. Replace META_PIXEL_ID when Arsalan has the real one. -->
  <script>
    window.META_PIXEL_ID = "000000000000000";
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
    fbq("init", window.META_PIXEL_ID);
    fbq("track", "PageView");
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=000000000000000&ev=PageView&noscript=1"/></noscript>
</head>
<body>
  <main>
    <h1>Your lota. Finally fits in a jacket.</h1>
    <figure class="hero">
      <img src="lota-stowed.png?v=2" width="800" height="800" alt="Pocket Lota folded and stowed">
    </figure>
    <p class="line">The one you already use. Jacket-pocket size.</p>
  </main>
  <div class="buy">
    <a id="buy" href="https://pocketlota.com">Buy</a>
  </div>
  <script>
    document.getElementById("buy").addEventListener("click", function () {
      if (typeof fbq === "function") {
        fbq("track", "Purchase", { currency: "USD" });
      }
    });
  </script>
</body>
</html>
